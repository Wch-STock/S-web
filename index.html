<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>上午深跌拉升监控</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0d1117; color:#e6edf3; font-family:-apple-system,"PingFang SC",sans-serif; padding:12px; padding-bottom:40px; }
  h2 { text-align:center; font-size:17px; margin-bottom:4px; }
  .sub { text-align:center; color:#8b949e; font-size:12px; margin-bottom:12px; line-height:1.5; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 12px; flex:1; text-align:center; font-size:12px; }
  .stat b { display:block; font-size:18px; color:#58a6ff; }
  button { background:#238636; color:#fff; border:none; border-radius:8px; padding:10px 14px; font-size:14px; flex:1; }
  button.stop { background:#30363d; }
  .tip { text-align:center; color:#3fb950; font-size:12px; margin:8px 0; line-height:1.6; padding:8px; background:#161b22; border-radius:8px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:10px 12px; margin:8px 0; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .name { font-size:16px; font-weight:bold; }
  .code { color:#8b949e; font-size:12px; }
  .red { color:#ff7b72; font-weight:bold; }
  .green { color:#3fb950; }
  .gray { color:#8b949e; }
  .small { font-size:12px; color:#8b949e; margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; }
  .empty { text-align:center; color:#8b949e; padding:30px; }
  .log { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:8px; font-size:11px; color:#8b949e; max-height:130px; overflow:auto; margin-top:10px; font-family:monospace; line-height:1.5; }
  .section-title { font-size:13px; color:#f0883e; margin:12px 0 4px 0; padding-left:4px; }
</style>
</head>
<body>
<h2>📈 上午深跌 → 翻红监控</h2>
<div class="sub">上午曾 ≤-4% 且当前翻红<br>仅沪深主板（排除创业板/科创板/北交所/ST）</div>

<div class="bar">
  <div class="stat">扫描<b id="cnt">0</b></div>
  <div class="stat">观察<b id="obs">0</b></div>
  <div class="stat">命中<b id="hit">0</b></div>
  <button id="btn">开始监控</button>
</div>

<div class="tip">✅ JSONP 直连腾讯，无需代理。仅扫有效代码区间，约 4,500 只。</div>

<div id="list"><div class="empty">点击"开始监控"加载数据</div></div>
<div class="log" id="log"></div>

<script>
const BATCH = 50;
const REFRESH_MS = 30000;
const DROP_PCT = -4;

// ============ 优化：只生成真实存在的代码区间 ============
function buildCodes() {
  const codes = [];
  // 沪市主板：600000–600999, 601000–601999, 603000–603999
  // 这三段覆盖了 99% 的沪市主板股票
  for (let i = 600000; i <= 600999; i++) codes.push('sh' + i);
  for (let i = 601000; i <= 601999; i++) codes.push('sh' + i);
  for (let i = 603000; i <= 603999; i++) codes.push('sh' + i);
  // 深市主板：000001–000999
  for (let i = 1; i <= 999; i++) codes.push('sz' + String(i).padStart(6, '0'));
  // 深市中小板：002001–002999
  for (let i = 2001; i <= 2999; i++) codes.push('sz' + String(i).padStart(6, '0'));
  return codes;
}

const state = {};
let running = false, timer = null;

function log(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  el.innerHTML = t + ' ' + msg + '<br>' + el.innerHTML;
  if (el.innerHTML.length > 2500) el.innerHTML = el.innerHTML.slice(0, 2500);
}

function fetchBatchJSONP(batch) {
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'https://qt.gtimg.cn/q=' + batch.join(',') + '&_t=' + Date.now();
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      const rows = [];
      for (const c of batch) {
        const g = window['v_' + c];
        if (!g || typeof g !== 'string') continue;
        const d = g.split('~');
        if (d.length < 35) continue;
        const name = d[1] || '';
        if (/ST/.test(name)) continue;
        rows.push({
          code: c,
          name: name,
          price: parseFloat(d[3]),
          pre: parseFloat(d[4]),
          low: parseFloat(d[34]),
          high: parseFloat(d[33]),
        });
      }
      s.remove();
      resolve(rows);
    };
    s.onload = finish;
    s.onerror = () => { finish(); };
    setTimeout(finish, 5000);
    document.head.appendChild(s);
  });
}

function getMin() {
  const h = new Date().getHours(), m = new Date().getMinutes();
  return h * 60 + m;
}

const t = getMin();
const isAM = t >= 9*60+30 && t <= 11*60+30;

async function scanReal() {
  const codes = buildCodes();
  const chunks = [];
  for (let i = 0; i < codes.length; i += BATCH) chunks.push(codes.slice(i, i + BATCH));

  let count = 0;
  const observing = [];
  const hitList = [];

  for (const chunk of chunks) {
    if (!running) break;
    try {
      const rows = await fetchBatchJSONP(chunk);
      for (const r of rows) {
        if (!r || !r.pre || r.price <= 0) continue;
        count++;
        const code = r.code;
        const st = state[code] = state[code] || { name: r.name, pre: r.pre, amLow: null, p1130: null, p1430: null, hit: false };
        st.name = r.name; st.pre = r.pre;
        const pre = r.pre;

        if (isAM) {
          st.amLow = st.amLow == null ? r.low : Math.min(st.amLow, r.low);
        }
        if (t === 11*60+30 && st.p1130 == null) st.p1130 = r.price;
        if (t === 14*60+30 && st.p1430 == null) st.p1430 = r.price;

        const amDropOk = st.amLow != null && st.amLow <= pre * (1 + DROP_PCT/100);
        const nowRed = r.price > pre;
        const p1130Red = st.p1130 != null && st.p1130 > pre;
        const p1430Red = st.p1430 != null && st.p1430 > pre;

        if (amDropOk && p1130Red && p1430Red && !st.hit) {
          st.hit = true;
        }

        if (st.hit) {
          hitList.push({ code, name: r.name, amLowPct: +((st.amLow/pre-1)*100).toFixed(2), p1130Pct: +((st.p1130/pre-1)*100).toFixed(2), p1430Pct: +((st.p1430/pre-1)*100).toFixed(2) });
        } else if (amDropOk && nowRed) {
          observing.push({ code, name: r.name, amLowPct: +((st.amLow/pre-1)*100).toFixed(2), curPct: +((r.price/pre-1)*100).toFixed(2), p1130: st.p1130, p1430: st.p1430 });
        }
      }
    } catch (e) {
      log('批失败: ' + e.message);
    }
    await new Promise(r => setTimeout(r, 80));
  }

  observing.sort((a, b) => a.amLowPct - b.amLowPct);
  hitList.sort((a, b) => a.amLowPct - b.amLowPct);

  document.getElementById('cnt').textContent = count;
  document.getElementById('obs').textContent = observing.length;
  document.getElementById('hit').textContent = hitList.length;

  let html = '';
  if (hitList.length) {
    html += '<div class="section-title">🎯 最终命中（上午深跌+11:30红+14:30红）</div>';
    html += hitList.map(h => `<div class="card">
      <div class="row"><div><span class="name">${h.name}</span> <span class="code">${h.code}</span></div><div class="red">${h.p1430Pct}%</div></div>
      <div class="small"><span>最低 <b class="red">${h.amLowPct}%</b></span><span>11:30 <b class="green">${h.p1130Pct}%</b></span><span>14:30 <b class="green">${h.p1430Pct}%</b></span></div>
    </div>`).join('');
  }
  if (observing.length) {
    html += '<div class="section-title">👀 观察中（上午深跌+当前红盘）</div>';
    html += observing.map(o => `<div class="card">
      <div class="row"><div><span class="name">${o.name}</span> <span class="code">${o.code}</span></div><div class="green">当前 ${o.curPct}%</div></div>
      <div class="small"><span>最低 <b class="red">${o.amLowPct}%</b></span><span>当前 <b class="green">${o.curPct}%</b></span></div>
    </div>`).join('');
  }
  if (!html) html = '<div class="empty">暂无数据<br><small>上午还没出现"跌≥4%后翻红"的票</small></div>';

  document.getElementById('list').innerHTML = html;
  log('扫描完成，有效 ' + count + ' 只，观察 ' + observing.length + '，命中 ' + hitList.length);
}

function start() {
  running = true;
  document.getElementById('btn').textContent = '停止';
  document.getElementById('btn').classList.add('stop');
  log('开始监控...');
  scanReal();
  timer = setInterval(scanReal, REFRESH_MS);
}
function stop() {
  running = false;
  clearInterval(timer);
  document.getElementById('btn').textContent = '开始监控';
  document.getElementById('btn').classList.remove('stop');
  log('已停止');
}
document.getElementById('btn').onclick = () => running ? stop() : start();
window.onbeforeunload = () => clearInterval(timer);

log('就绪。当前 ' + new Date().toLocaleTimeString('zh-CN',{hour12:false}) + '，JSONP直连腾讯。');
</script>
</body>
</html>
